name: CharaKit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install helper dependency
        run: python -m pip install -r plugins/charakit/requirements.txt
      - name: Run workflow tests
        run: python -m unittest discover -s tests -v
      - name: Build plugin package
        run: python tools/build_plugin.py --output dist/charakit.zip
      - name: Verify package contents and integrity
        run: python -c "import zipfile; p=zipfile.ZipFile('dist/charakit.zip'); assert p.testzip() is None; assert 'plugin.json' in p.namelist(); assert 'skills/charakit-expressions/SKILL.md' in p.namelist(); assert all(not n.startswith(('art-output/', '.dev-checks/')) and not n.endswith('.pyc') for n in p.namelist()); p.close()"

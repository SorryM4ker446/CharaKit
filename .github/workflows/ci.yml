name: CharaKit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install helper dependency
        run: python -m pip install -r plugins/charakit/requirements.txt
      - name: Install browser QA dependency
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r tools/requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run repeatable QA, build and packaged smoke checks
        run: python tools/qa.py run --output .dev-checks/ci ${{ runner.os == 'Linux' && '--browser' || '' }}
      - name: Print QA result and failure logs
        if: always()
        shell: bash
        run: python -c "from pathlib import Path; p=Path('.dev-checks/ci'); print((p/'summary.json').read_text() if (p/'summary.json').exists() else 'QA summary missing'); [print(str(f)+'\n'+f.read_text(encoding='utf-8')[-12000:]) for f in p.glob('*.log')]"
